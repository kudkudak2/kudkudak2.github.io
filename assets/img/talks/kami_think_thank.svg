<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">From Models to Medicine artwork</title>
  <desc id="desc">Neon styled cover art with a monitor, molecule, pills, and the words From Models to Medicine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16072d"/>
      <stop offset="0.52" stop-color="#020205"/>
      <stop offset="1" stop-color="#1c0b02"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#28b9ff"/>
      <stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" x2="1">
      <stop offset="0" stop-color="#9a2bff"/>
      <stop offset="1" stop-color="#ff4ba8"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" x2="1">
      <stop offset="0" stop-color="#1fd7ff"/>
      <stop offset="1" stop-color="#ff3c7b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#2b2440" stroke-width="2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1280" height="1280" fill="url(#bg)"/>
  <rect width="1280" height="1280" fill="url(#grid)" opacity="0.75"/>
  <g opacity="0.35" filter="url(#glow)">
    <circle cx="90" cy="160" r="180" fill="#6b28ff"/>
    <circle cx="1220" cy="1110" r="250" fill="#ff6a1b"/>
  </g>

  <g transform="translate(110 170) rotate(-18)" filter="url(#glow)">
    <rect x="0" y="0" width="245" height="245" rx="16" fill="#11131e" stroke="#171a29" stroke-width="8"/>
    <rect x="55" y="58" width="145" height="88" rx="12" fill="none" stroke="#19d9ff" stroke-width="12"/>
    <path d="M96 176h70M130 146v32" stroke="#19d9ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M82 85h92M82 110h92" stroke="#19d9ff" stroke-width="4" stroke-linecap="round" opacity="0.65" stroke-dasharray="18 15"/>
  </g>

  <g transform="translate(1010 200)" fill="none" stroke="#9d54ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="55" cy="35" r="33"/>
    <circle cx="110" cy="55" r="38"/>
    <circle cx="77" cy="106" r="40"/>
    <path d="M35 89c-35 3-55 18-66 39 39 2 74-3 105-23M112 93c29 34 66 58 112 74"/>
  </g>

  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" filter="url(#glow)">
    <text x="640" y="305" font-size="176" fill="url(#blue)" letter-spacing="5">FROM</text>
    <text x="640" y="525" font-size="176" fill="url(#magenta)" letter-spacing="5">MODELS</text>
    <text x="640" y="735" font-size="172" fill="#ff3f8e" letter-spacing="7">TO</text>
    <g transform="translate(325 805) rotate(-8)">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#35d9ff"/>
      <rect x="107" y="0" width="92" height="36" rx="18" fill="#ff416e"/>
      <rect x="214" y="0" width="92" height="36" rx="18" fill="#8d35ff"/>
      <rect x="321" y="0" width="92" height="36" rx="18" fill="#ff9a3b"/>
      <rect x="428" y="0" width="92" height="36" rx="18" fill="#4dbb57"/>
      <rect x="535" y="0" width="92" height="36" rx="18" fill="#ce42ff"/>
    </g>
    <text x="640" y="1045" font-size="166" fill="url(#blue)" letter-spacing="3">MEDICINE</text>
  </g>

  <line x1="100" y1="1118" x2="1180" y2="1118" stroke="#b9b3bd" stroke-width="4" opacity="0.7"/>
  <text x="640" y="1176" fill="#a8a0ad" font-family="Courier New, monospace" font-size="34" font-weight="700" letter-spacing="13" text-anchor="middle">A KAMI THINK THANK SHOW</text>
</svg>
